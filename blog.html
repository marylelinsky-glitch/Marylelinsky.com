<!DOCTYPE HTML>
<html>
<head>
	<title>Diário — Marylelin Lelinsky</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

	<!-- NAO INDEXAR: o Google nao deve encontrar esta pagina -->
	<meta name="robots" content="noindex, nofollow" />

	<link rel="stylesheet" href="assets/css/main.css" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

	<!-- Favicon -->
	<link rel="icon" href="favicon.ico" sizes="any" />
	<link rel="apple-touch-icon" href="apple-touch-icon.png" />
	<meta name="theme-color" content="#16232e" />

	<style>
		body {
			background: linear-gradient(135deg, #16232e 0%, #2e4756 55%, #5e7a86 100%);
			color: #f5f5f5;
		}

		h1, h2, h3 { color: #ffffff; }
		p { color: #e0e0e0; }

		.button {
			background-color: #e8b4b8 !important;
			color: #2a1a1c !important;
			border: none !important;
		}
		.button:hover { background-color: #d89aa0 !important; }

		/* CAIXA DA PALAVRA-PASSE */
		#gate {
			max-width: 420px;
			margin: 18vh auto 0;
			text-align: center;
			padding: 40px 30px;
			background: rgba(255,255,255,0.06);
			border-radius: 12px;
		}
		#gate input[type=password] {
			width: 100%;
			margin: 1em 0;
			padding: 0.75em 1em;
			border-radius: 6px;
			border: 1px solid rgba(255,255,255,0.25);
			background: rgba(255,255,255,0.1);
			color: #fff;
			text-align: center;
		}
		#gate input[type=password]::placeholder { color: rgba(255,255,255,0.5); }
		#gate-error { color: #e8b4b8; min-height: 1.5em; }

		/* CONTEUDO DO DIARIO */
		#diario { display: none; max-width: 720px; margin: 0 auto; padding: 60px 25px; }
		#diario article {
			background: rgba(255,255,255,0.05);
			border-radius: 12px;
			padding: 35px 40px;
			margin-bottom: 40px;
		}
		#diario .data { color: #e8b4b8; font-size: 0.9em; letter-spacing: 0.08em; text-transform: uppercase; }
		#diario .texto br { display: block; margin-bottom: 0.8em; content: ""; }
	</style>
</head>

<body>

	<!-- PORTA DE ENTRADA -->
	<div id="gate">
		<h1><i class="fa-solid fa-feather-pointed"></i> Diário</h1>
		<p>Este canto é privado. Escreve a palavra-passe para continuar.</p>
		<form id="gate-form">
			<input type="password" id="gate-pass" placeholder="palavra-passe" autocomplete="off" />
			<button class="button" type="submit"><i class="fa-solid fa-key"></i> Entrar</button>
		</form>
		<p id="gate-error"></p>
	</div>

	<!-- CONTEUDO DO DIARIO (carregado do Google Sheets) -->
	<main id="diario"></main>

	<!-- VERIFICACAO DA PALAVRA-PASSE (hash SHA-256 — nao e texto puro) -->
	<script>
		// 1) Escolhe a tua palavra-passe.
		// 2) Abre https://emn178.github.io/online-tools/sha256.html
		//    escreve a palavra-passe, copia o resultado (ex.: a3f1...) e cola aqui em baixo.
		var PASSWORD_HASH = "COLOCA_AQUI_O_HASH_SHA256_DA_TUA_PALAVRA_PASSE";

		// 3) ID da tua folha de Google Sheets (ve as instrucoes no fim do ficheiro)
		var SHEET_ID = "COLOCA_AQUI_O_ID_DA_TUA_FOLHA";
		var SHEET_URL = "https://opensheet.elk.sh/" + SHEET_ID + "/diario";

		async function sha256(texto) {
			var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texto));
			return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
		}

		// Escapa HTML para evitar injecao de codigo vinda da folha
		function esc(s) {
			return String(s || "").replace(/[&<>"']/g, function(c) {
				return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
			});
		}

		function carregarDiario() {
			fetch(SHEET_URL)
				.then(function(r) { return r.json(); })
				.then(function(linhas) {
					var html = "";
					linhas.forEach(function(l) {
						if (!l.titulo && !l.texto) return;
						html += "<article>"
						      + "<p class=\"data\">" + esc(l.data) + "</p>"
						      + "<h2>" + esc(l.titulo) + "</h2>"
						      + "<p class=\"texto\">" + esc(l.texto).replace(/\n/g, "<br>") + "</p>"
						      + "</article>";
					});
					document.getElementById("diario").innerHTML =
						html || "<article><p>O diário ainda não tem entradas.</p></article>";
				})
				.catch(function() {
					document.getElementById("diario").innerHTML =
						"<article><p>Não foi possível carregar o diário. Verifica a ligação ou as definições da folha.</p></article>";
				});
		}

		document.getElementById("gate-form").addEventListener("submit", async function(e) {
			e.preventDefault();
			var pass = document.getElementById("gate-pass").value;
			var h = await sha256(pass);

			if (h === PASSWORD_HASH) {
				document.getElementById("gate").style.display = "none";
				document.getElementById("diario").style.display = "block";
				carregarDiario();
			} else {
				document.getElementById("gate-error").textContent = "Palavra-passe errada. Tenta outra vez.";
				document.getElementById("gate-pass").value = "";
			}
		});
	</script>

	<!--
		INSTRUCOES — configurar a folha de Google Sheets:

		1. Cria uma nova folha em sheets.google.com
		2. Na primeira linha escreve os cabecalhos EXATAMENTE assim:
		      A1: data      B1: titulo      C1: texto
		3. Nas linhas seguintes escreve as entradas (a mais recente no TOPO).
		   No campo "texto", podes usar varias linhas (Enter) — aparecem como paragrafos.
		4. Ficheiro -> Partilhar -> Publicar na Web -> escolhe "diario" (a folha) -> Publicar.
		5. Copia o ID da folha do URL do browser:
		   https://docs.google.com/spreadsheets/d/ESTE_E_O_ID/edit -> copia so a parte do meio
		6. Cola esse ID em SHEET_ID, mais acima neste ficheiro.
		7. Para escrever novas entrades: abre a folha, escreve uma linha nova no topo.
		   Nao e preciso mexer em mais nada — o site atualiza sozinho.

		NOTA: nao partilhes o link da folha com ninguem. Quem tiver o link da folha
		consegue ler as entradas, mas nao consegue entrar no diario sem o saber.
	-->

</body>
</html>
